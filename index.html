<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ki Legends – All-Star Pixel Clash</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<style>
:root{
  --ink:#070a22;--navy:#10164a;--navy2:#1b2476;--cyan:#35e6ff;--orange:#ff9420;--red:#f0452c;--green:#40d95a;
  --yellow:#ffd23a;--purple:#a05cf2;--blue:#3b82ff;--paper:#fff4d8;--gold:#ffc83a;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
*,*::before,*::after{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{height:100%;background:#05071a;color-scheme:dark;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;height:100%;background:#05071a;color:#fff;font-family:'Press Start 2P','Courier New',monospace;font-size:10px;line-height:1.5;
  overflow:hidden;user-select:none;-webkit-user-select:none;touch-action:manipulation}
button{font:inherit;color:#fff;border:0;background:none;padding:0;cursor:pointer}
button:focus-visible{outline:3px solid var(--cyan);outline-offset:4px}
canvas{image-rendering:pixelated;image-rendering:crisp-edges;display:block}
#app{position:relative;height:100%;max-width:480px;margin:0 auto;overflow:hidden;background:#0b0f33}
.screen{position:absolute;inset:0;display:none}
.screen.on{display:block}
.pad{padding:58px 12px 78px;overflow-y:auto;overflow-x:hidden;
  background:repeating-linear-gradient(135deg,rgba(255,255,255,.035) 0 8px,transparent 8px 16px),linear-gradient(#10164a,#1a1060 70%,#240f58)}
h2{margin:6px 0 14px;font-size:15px;font-weight:400;color:var(--yellow);text-shadow:3px 3px 0 #000}
.px{box-shadow:0 -3px 0 0 var(--bd,#000),0 3px 0 0 var(--bd,#000),-3px 0 0 0 var(--bd,#000),3px 0 0 0 var(--bd,#000)}
.btn{display:inline-block;background:var(--bg,#2a3aa8);padding:12px 14px;margin:3px;text-shadow:2px 2px 0 #000;
  box-shadow:0 -3px 0 0 #000,0 3px 0 0 #000,-3px 0 0 0 #000,3px 0 0 0 #000,inset 0 -4px 0 rgba(0,0,0,.35),inset 0 4px 0 rgba(255,255,255,.25)}
.btn:active{transform:translateY(2px)}
.btn[disabled]{filter:grayscale(1) brightness(.6);cursor:default}
.gem{display:inline-block;width:11px;height:11px;background:#8cecff;transform:rotate(45deg);box-shadow:inset -3px -3px 0 #2aa6d6;margin:0 4px 0 2px;vertical-align:-1px}

/* header */
#hdr{position:absolute;left:10px;right:10px;top:8px;height:36px;display:flex;align-items:center;gap:10px;z-index:20;pointer-events:none}
#hdr>*{pointer-events:auto}
.hbox{background:rgba(7,10,34,.88);height:30px;display:flex;align-items:center;padding:0 8px;margin:3px;box-shadow:0 -3px 0 0 #000,0 3px 0 0 #000,-3px 0 0 0 #000,3px 0 0 0 #000}
#hLv{color:var(--yellow);font-size:12px;text-shadow:2px 2px 0 #000;white-space:nowrap}
#hXp{flex:1;height:10px;background:#000;border:2px solid #000;margin:0 2px;box-shadow:0 0 0 2px #2a3380}
#hXp i{display:block;height:100%;background:var(--cyan);width:0}
#hGem{font-size:12px;white-space:nowrap}
#hPlus{background:var(--green);color:#000;width:20px;height:20px;margin-left:8px;font-size:12px;line-height:20px;text-align:center;box-shadow:0 -2px 0 #000,0 2px 0 #000,-2px 0 0 #000,2px 0 0 #000}

/* home */
#homeCv{position:absolute;inset:0;width:100%;height:100%}
.side{position:absolute;right:10px;top:66px;display:flex;flex-direction:column;gap:12px;align-items:flex-end}
.side .btn{font-size:8px;padding:8px 8px;--bg:#1b2476}
#lead{position:absolute;left:14px;top:70px;text-shadow:3px 3px 0 #000}
#lead b{display:block;font-size:15px;font-weight:400;color:var(--yellow)}
#lead span{font-size:8px;color:#bfe0ff}
.modes{position:absolute;left:0;right:0;bottom:92px;display:flex;align-items:flex-end;justify-content:center;gap:0;padding:0 8px}
.mode{display:block;position:relative;height:74px;transform:skewX(-10deg);margin:0 4px;text-shadow:3px 3px 0 #000;font-size:15px;text-align:center;
  box-shadow:0 -3px 0 0 #000,0 3px 0 0 #000,-3px 0 0 0 #000,3px 0 0 0 #000,inset 0 -6px 0 rgba(0,0,0,.35),inset 0 5px 0 rgba(255,255,255,.3)}
.mode>*{display:block;transform:skewX(10deg)}
.mode small{font-size:7px;color:#fff;margin-top:5px;text-shadow:2px 2px 0 #000}
.mode:active{transform:skewX(-10deg) translateY(3px)}
.m-story{flex:1.15;background:linear-gradient(#ffb23a,#f0701c);padding-top:20px}
.m-pvp{flex:1.15;background:linear-gradient(#4aa0ff,#2a50d8);padding-top:20px}
.m-hunt{flex:1;height:92px;background:linear-gradient(#58e070,#1fa03a);padding-top:16px;font-size:13px}
#nav{position:absolute;left:0;right:0;bottom:0;height:70px;display:flex;background:#080b2a;border-top:4px solid #000;z-index:25;box-shadow:0 -4px 0 #2a3380}
#nav button{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;font-size:7px;color:#9fb0ff;background:linear-gradient(#10164a,#0a0e33)}
#nav button canvas{width:27px;height:27px}
#nav button.on{color:#000;background:linear-gradient(#ffe36a,#ffb020)}
#nav button.home{flex:1.2}

/* lists */
.slots{display:flex;gap:10px;margin-bottom:14px}
.slot{flex:1;padding:6px 4px 6px;background:#0a0e33;text-align:center;font-size:7px;--bd:#2a3380;margin:3px}
.slot.sel{--bd:var(--yellow);background:#2a2260}
.slot canvas{width:64px;height:68px;margin:0 auto 6px}
.roster{display:block}
.rgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.rhead{margin:16px 3px 12px;font-size:9px;color:var(--sc);text-shadow:2px 2px 0 #000;border-left:6px solid var(--sc);padding-left:8px;line-height:1.4}
.rhead span{color:#9fb0ff;font-size:7px;margin-left:6px}
.rc{padding:3px;background:#0a0e33;font-size:6px;text-align:center;margin:3px;--bd:#2a3380;color:#fff;line-height:1.4}
.rc.sel{--bd:var(--yellow)}
.rc canvas{width:100%;height:auto;aspect-ratio:28/30;margin-bottom:4px}
.rc.lock canvas{opacity:.9}
.rc.lock{color:#6f78b8}
.detail{display:flex;gap:12px;background:#0a0e33;padding:10px;margin:3px 3px 16px;--bd:#2a3380;min-height:150px}
.detail canvas.big{width:96px;height:120px;flex:none;background:linear-gradient(#222a7a,#10164a)}
.detail .tx{flex:1;font-size:8px;line-height:1.9}
.detail h3{margin:0 0 4px;font-size:12px;font-weight:400;color:var(--yellow);text-shadow:2px 2px 0 #000}
.tag{display:inline-block;padding:2px 5px;color:#000;font-size:7px;margin-right:4px}
.st{display:flex;align-items:center;gap:10px;width:calc(100% - 6px);text-align:left;background:#0a0e33;padding:10px;margin:3px 3px 14px;--bd:#2a3380;
  box-shadow:0 -3px 0 0 var(--bd),0 3px 0 0 var(--bd),-3px 0 0 0 var(--bd),3px 0 0 0 var(--bd)}
.st>b{font-size:20px;color:var(--yellow);width:26px;text-shadow:3px 3px 0 #000;font-weight:400}
.st .nm{flex:1;font-size:9px;line-height:1.8}
.st .fo{display:flex;gap:4px;margin-top:6px}
.st .fo canvas{width:28px;height:30px}
.st.lock{opacity:.5;filter:grayscale(.8)}
.stars{color:#554;font-size:12px;letter-spacing:2px}
.stars em{font-style:normal;color:var(--yellow)}
.ms{background:#0a0e33;padding:10px;margin:3px 3px 14px;--bd:#2a3380;display:flex;align-items:center;gap:8px;box-shadow:0 -3px 0 0 var(--bd),0 3px 0 0 var(--bd),-3px 0 0 0 var(--bd),3px 0 0 0 var(--bd)}
.ms .tx{flex:1;font-size:8px;line-height:1.8}
.ms .pb{height:8px;background:#000;margin-top:6px;border:1px solid #2a3380}
.ms .pb i{display:block;height:100%;background:var(--green)}
.ms .btn{font-size:8px;padding:8px}
.sbanner{display:flex;flex-direction:column;align-items:stretch;gap:10px;background:linear-gradient(#2a1a78,#10164a);padding:10px;margin:3px 3px 16px;--bd:var(--yellow);box-shadow:0 -3px 0 0 var(--bd),0 3px 0 0 var(--bd),-3px 0 0 0 var(--bd),3px 0 0 0 var(--bd)}
.sbanner canvas{width:100%;height:auto;aspect-ratio:150/50;flex:none;background:radial-gradient(#5a46d0,#1a1360)}
.sbanner .tx{font-size:8px;line-height:2}
.sbanner h3{margin:0 0 6px;font-weight:400;font-size:12px;color:var(--yellow);text-shadow:2px 2px 0 #000}
.srow{display:flex;gap:10px;margin-bottom:14px}
.srow .btn{flex:1;text-align:center;font-size:10px;line-height:1.9}
.odds{font-size:7px;line-height:2;color:#9fb0ff}

/* modal + toast */
#modal{position:absolute;inset:0;background:rgba(3,4,18,.8);display:none;align-items:center;justify-content:center;z-index:100;padding:16px;overflow-y:auto}
#modal.on{display:flex}
.box{background:#10164a;padding:16px;width:100%;max-width:360px;margin:auto;--bd:var(--yellow);text-align:center;font-size:9px;line-height:1.9;
  box-shadow:0 -4px 0 0 var(--bd),0 4px 0 0 var(--bd),-4px 0 0 0 var(--bd),4px 0 0 0 var(--bd)}
.box h3{font-weight:400;font-size:18px;margin:2px 0 10px;color:var(--yellow);text-shadow:3px 3px 0 #000}
.box p{margin:6px 0}
.box ul{text-align:left;padding-left:16px;margin:8px 0}
.box li{margin-bottom:8px}
.box .row{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;margin-top:12px}
.pull{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin:12px 0}
.pull.one{grid-template-columns:1fr;width:120px;margin:12px auto}
.pc{position:relative;padding:2px;background:#000;font-size:6px;--bd:var(--rc);animation:rev .35s steps(4) both}
.pc canvas{width:100%;height:auto;aspect-ratio:28/30}
.pc i{position:absolute;left:0;right:0;bottom:-2px;font-style:normal;background:rgba(0,0,0,.8);color:var(--rc);padding:1px 0}
@keyframes rev{from{transform:scale(.2);filter:brightness(4)}to{transform:scale(1);filter:none}}
#toast{position:absolute;left:12px;right:12px;bottom:84px;text-align:center;background:#000;border:3px solid var(--yellow);padding:10px;font-size:8px;z-index:120;display:none;line-height:1.7}
#toast.on{display:block}

/* battle */
#cv{position:absolute;inset:0;width:100%;height:100%}
#pops,#hud{position:absolute;inset:0;pointer-events:none}
#hud button,#hud .tap{pointer-events:auto}
.pop{position:absolute;transform:translate(-50%,-50%);font-size:13px;white-space:nowrap;text-shadow:2px 0 #000,-2px 0 #000,0 2px #000,0 -2px #000,2px 2px #000,-2px -2px #000,2px -2px #000,-2px 2px #000;animation:pop .85s steps(9) forwards}
.pop.foe{color:#fff}
.pop.crit{color:var(--yellow);font-size:16px}
.pop.me{color:#ff6a4a}
.pop.cy{color:var(--cyan);font-size:11px}
.pop.bad{color:#ff6a4a;font-size:10px}
@keyframes pop{0%{opacity:0;margin-top:6px}12%{opacity:1;margin-top:0}100%{opacity:0;margin-top:-34px}}
#tTimer{position:absolute;left:12px;top:10px;font-size:20px;color:#fff;text-shadow:3px 3px 0 #000,-1px -1px 0 #000}
#btnPause{position:absolute;left:14px;top:48px;width:34px;height:34px;background:rgba(0,0,0,.55);font-size:12px;box-shadow:0 0 0 3px #fff}
#eBar{position:absolute;left:86px;right:12px;top:12px;height:16px;background:#000;border:3px solid #000;box-shadow:0 0 0 2px #fff;transform:skewX(-14deg)}
#eLost,#eFill{position:absolute;left:0;top:0;bottom:0;background:#d01818;width:100%;transition:width .9s .35s steps(10)}
#eFill{background:#22dd22;transition:width .2s steps(4)}
#eName{position:absolute;left:88px;top:36px;font-size:8px;text-shadow:2px 2px 0 #000}
#eHp{position:absolute;right:14px;top:36px;font-size:12px;text-shadow:2px 2px 0 #000}
#eTeam{position:absolute;right:8px;top:62px;display:flex;flex-direction:column;align-items:flex-end;gap:8px}
.ft{width:40px;position:relative;margin:3px}
.ft.on{width:58px}
.ft canvas{width:100%;height:auto;aspect-ratio:28/30;box-shadow:0 0 0 3px var(--ec,#f0452c),0 0 0 6px #000;background:#000}
.ft.dead canvas{filter:grayscale(1) brightness(.4)}
.hpb{height:5px;background:#000;margin-top:5px}
.hpb i{display:block;height:100%;background:#22dd22;width:100%}
#pBench{position:absolute;left:12px;top:42%;display:flex;flex-direction:column;gap:12px}
.bt{width:52px;margin:3px;position:relative;display:block}
.bt canvas{width:100%;height:auto;aspect-ratio:28/30;box-shadow:0 0 0 3px var(--ec,#40d95a),0 0 0 6px #000;background:#000}
.bt.dead canvas{filter:grayscale(1) brightness(.4)}
.bt.cd{opacity:.5}
#combo{position:absolute;right:14px;top:44%;text-align:right;font-style:italic;display:none;text-shadow:3px 3px 0 #000}
#combo b{font-size:30px;font-weight:400;color:#fff}
#combo span{font-size:10px;margin-left:4px}
#combo.bump{animation:bump .12s steps(3)}
@keyframes bump{50%{transform:scale(1.25)}}
#orbs{position:absolute;right:10px;top:54%;display:grid;grid-template-columns:repeat(2,18px);gap:6px 8px;pointer-events:auto}
#orbs i{width:18px;height:18px;background:rgba(190,150,110,.45);clip-path:polygon(30% 0,70% 0,100% 30%,100% 70%,70% 100%,30% 100%,0 70%,0 30%)}
#orbs i:nth-child(even){transform:translateY(10px)}
#orbs i.on{background:radial-gradient(circle at 35% 30%,#ffe9a0 0 15%,#ff9a1c 16% 100%)}
#orbs.full i{animation:orb .5s steps(2) infinite}
@keyframes orb{50%{filter:brightness(1.6)}}
#orbs.full::after{content:"TAP!";position:absolute;left:-44px;top:-18px;font-size:8px;color:var(--yellow);text-shadow:2px 2px 0 #000}
#pSer{position:absolute;left:14px;bottom:122px;font-size:6px;background:rgba(0,0,0,.7);padding:3px 4px;line-height:1.2}
#pPort{position:absolute;left:12px;bottom:34px;width:78px}
#pPort canvas{width:100%;height:auto;aspect-ratio:28/30;box-shadow:0 0 0 3px #a05cf2,0 0 0 6px #000;background:#000}
#rush{position:absolute;right:-16px;bottom:0;width:10px;height:100%;background:#000;box-shadow:0 0 0 2px #fff}
#rush i{position:absolute;left:0;right:0;bottom:0;background:linear-gradient(#ffb020,#ff6a1c);height:0}
#pPort.rdy canvas{animation:glow .5s steps(2) infinite}
@keyframes glow{50%{box-shadow:0 0 0 3px #ffd23a,0 0 0 6px #ff9420,0 0 14px 6px #ffd23a}}
#pHpNum{position:absolute;left:24px;bottom:11px;font-size:9px;text-shadow:2px 2px 0 #000;white-space:nowrap;z-index:2}
#pBar{position:absolute;left:12px;right:12px;bottom:10px;height:14px;background:#000;border:3px solid #000;box-shadow:0 0 0 2px #fff;transform:skewX(-14deg)}
#pFill{position:absolute;left:0;top:0;bottom:0;width:100%;background:#22dd22;transition:width .15s steps(3)}
#pFill.mid{background:#ddc022}#pFill.lo{background:#e03030}
#kiWrap{position:absolute;right:12px;bottom:146px;width:232px;display:flex;align-items:center;gap:6px;pointer-events:none}
#kiNum{font-size:13px;color:var(--cyan);width:40px;text-align:right;text-shadow:2px 2px 0 #000}
#kiSeg{flex:1;display:grid;grid-template-columns:repeat(10,1fr);gap:2px;background:#000;padding:2px;box-shadow:0 0 0 2px #fff}
#kiSeg i{height:12px;background:#12354a}
#kiSeg i.on{background:var(--cyan)}
#cards,#defense{position:absolute;right:12px;bottom:34px;width:232px;height:104px;display:flex;gap:8px}
.card{position:relative;flex:1;background:var(--cc);display:flex;align-items:center;justify-content:center;
  box-shadow:0 -3px 0 0 #000,0 3px 0 0 #000,-3px 0 0 0 #000,3px 0 0 0 #000,inset 0 0 0 3px rgba(255,255,255,.75),inset 0 -10px 0 rgba(0,0,0,.2);margin:3px 0}
.card canvas{width:100%;height:auto;padding:10px 12px 22px}
.card small{position:absolute;left:0;right:0;bottom:7px;text-align:center;font-size:6px;color:#fff;text-shadow:1px 1px 0 #000,-1px -1px 0 #000,1px -1px 0 #000,-1px 1px 0 #000;letter-spacing:0}
.card i{position:absolute;top:-6px;right:-6px;background:#0a4d6a;border:3px solid #000;color:#fff;font-style:normal;font-size:9px;padding:4px 3px;box-shadow:inset 0 0 0 2px var(--cyan);text-shadow:1px 1px 0 #000}
.card.off{filter:grayscale(.75) brightness(.55)}
.card.empty{background:#10164a;box-shadow:0 -3px 0 0 #000,0 3px 0 0 #000,-3px 0 0 0 #000,3px 0 0 0 #000;filter:none}
.card:active:not(.off){transform:translateY(3px)}
#defense{display:none}
#defense.on{display:flex}
#defense button{flex:1;margin:3px 0;font-size:11px;text-shadow:2px 2px 0 #000;line-height:1.7;
  box-shadow:0 -3px 0 0 #000,0 3px 0 0 #000,-3px 0 0 0 #000,3px 0 0 0 #000,inset 0 0 0 3px rgba(255,255,255,.7)}
#bGuard{background:#2a6af0}#bVanish{background:#9a3ae8}
#defense small{display:block;font-size:7px;margin-top:6px}
#defense button.off{filter:grayscale(1) brightness(.5)}
#cards.hide{display:none}
#ult{position:absolute;right:12px;bottom:176px;width:232px;height:38px;display:none;background:linear-gradient(#ffe36a,#ff9a1c);color:#000;font-size:10px;
  box-shadow:0 -3px 0 0 #000,0 3px 0 0 #000,-3px 0 0 0 #000,3px 0 0 0 #000,inset 0 -5px 0 rgba(0,0,0,.25);animation:glow2 .6s steps(2) infinite;margin:3px 0}
#ult.on{display:block}
@keyframes glow2{50%{filter:brightness(1.3)}}
#banner{position:absolute;left:0;right:0;top:30%;text-align:center;font-size:24px;color:#fff;display:none;text-shadow:4px 4px 0 #000,-2px -2px 0 #000,2px -2px 0 #000,-2px 2px 0 #000}
#banner.on{display:block;animation:ban .35s steps(5)}
#banner small{display:block;font-size:9px;margin-top:10px;color:var(--yellow)}
@keyframes ban{from{transform:scale(2.2);opacity:0}to{transform:scale(1);opacity:1}}
#tip{position:absolute;left:14px;right:14px;bottom:224px;text-align:center;font-size:8px;line-height:1.8;background:rgba(0,0,0,.78);padding:8px;display:none;border:3px solid var(--cyan)}
#tip.on{display:block}
#cutin{position:absolute;inset:0;display:none;pointer-events:none;overflow:hidden}
#cutin.on{display:block}
#cutin .band{position:absolute;left:-10%;right:-10%;top:30%;height:150px;background:repeating-linear-gradient(100deg,#ff9a1c 0 14px,#ffd23a 14px 28px);transform:skewY(-6deg);animation:cslide .25s steps(5) both;border-top:5px solid #000;border-bottom:5px solid #000}
#cutin canvas{position:absolute;left:6%;top:calc(30% - 40px);width:170px;height:182px;animation:cslide .3s steps(5) both;box-shadow:0 0 0 4px #000}
#cutin .nm{position:absolute;left:0;right:0;top:calc(30% + 62px);text-align:right;padding-right:22px;font-size:15px;color:#fff;text-shadow:3px 3px 0 #000,-2px -2px 0 #000,2px -2px 0 #000,-2px 2px 0 #000;animation:cslide .35s steps(5) both}
#cutin .nm small{display:block;font-size:8px;color:#000;text-shadow:none;margin-bottom:8px}
@keyframes cslide{from{transform:translateX(120%) skewY(-6deg)}to{transform:translateX(0) skewY(-6deg)}}
#cutin canvas{animation-name:cslide2}
@keyframes cslide2{from{transform:translateX(160%)}to{transform:translateX(0)}}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01s!important}}
#elchart{position:absolute;left:14px;top:92px;background:rgba(0,0,0,.6);padding:4px 5px 3px;font-size:6px;line-height:1;box-shadow:0 0 0 2px #fff;pointer-events:none}
#elchart b{display:block;font-weight:400;color:#fff;margin-bottom:4px;letter-spacing:0}
#elchart .er{display:flex;align-items:center;gap:2px;margin-bottom:3px;padding:1px;opacity:.85}
#elchart .er i{display:block;width:8px;height:8px}
#elchart .er u{text-decoration:none;color:#fff;width:6px;text-align:center}
#elchart .er.good{opacity:1;box-shadow:0 0 0 1px #7dff7d;background:rgba(125,255,125,.25)}
#elchart .er.bad{opacity:1;box-shadow:0 0 0 1px #ff6a5a;background:rgba(255,90,70,.25)}
.eltab{text-align:left;margin:8px 0;font-size:8px;line-height:2.1}
.eltab span{display:inline-block;padding:0 4px;color:#000}
.btabs{display:flex;gap:10px;margin:0 3px 16px}
.btabs button{flex:1;padding:10px 4px;margin:3px;font-size:9px;background:#0a0e33;color:#9fb0ff;text-shadow:2px 2px 0 #000;box-shadow:0 -3px 0 0 #2a3380,0 3px 0 0 #2a3380,-3px 0 0 0 #2a3380,3px 0 0 0 #2a3380}

const chLv=id=>(S.cl[id]||[1,0])[0],chXp=id=>(S.cl[id]||[1,0])[1],chStars=id=>Math.min(14,S.owned[id]||0);

function giveXP(id,n){const c=S.cl[id]||(S.cl[id]=[1,0]);if(c[0]>=LVMAX)return 0;let ups=0;c[1]+=n;while(c[0]<LVMAX&&c[1]>=lvNeed(c[0])){c[1]-=lvNeed(c[0]);c[0]++;ups++}if(c[0]>=LVMAX)c[1]=0;return ups}
function starRow(n){let h='<span class="strow">';for(let i=0;i<7;i++){const blue=n>7&&i<n-7,gold=!blue&&i<Math.min(n,7);h+='<i class="s'+(blue?' b':gold?' g':'')+'"></i>'}return h+'</span>'}

/* ---------- pixel helpers ---------- */
function pl(c,x1,y1,x2,y2,w,col){const n=Math.max(Math.abs(x2-x1),Math.abs(y2-y1))||1;c.fillStyle=col;for(let i=0;i<=n;i++)c.fillRect(Math.round(x1+(x2-x1)*i/n-w/2),Math.round(y1+(y2-y1)*i/n-w/2),w,w)}
function pxc(c,x,y,r,col){c.fillStyle=col;for(let dy=-r;dy<=r;dy++){const dx=Math.floor(Math.sqrt(r*r+r*.8-dy*dy));c.fillRect(Math.round(x-dx),Math.round(y+dy),dx*2+1,1)}}
function parc(c,x,y,r,a0,a1,col,s=2){c.fillStyle=col;const n=Math.max(10,Math.round(r*Math.abs(a1-a0)*1.5));for(let i=0;i<=n;i++){const a=a0+(a1-a0)*i/n;c.fillRect(Math.round(x+Math.cos(a)*r),Math.round(y+Math.sin(a)*r),s,s)}}
function pring(c,x,y,r,col,s=2){c.fillStyle=col;const n=Math.max(16,Math.round(r*5));for(let i=0;i<n;i++){const a=i/n*6.283;c.fillRect(Math.round(x+Math.cos(a)*r),Math.round(y+Math.sin(a)*r),s,s)}}
function mix(a,b,t){const P=s=>{s=s.slice(1);if(s.length===3)s=s.replace(/./g,'$&$&');return parseInt(s,16)};const A=P(a),B=P(b);const f=(s)=>Math.round(((A>>s)&255)+((((B>>s)&255)-((A>>s)&255))*t));return`rgb(${f(16)},${f(8)},${f(0)})`}

    for(let f=0;f<fan;f++){const idx=r*fan+f;shoot(A,D,col,sz,()=>hit(idx,tot),{shape:o.shape||'ball',ty:D.y-22+(f-(fan-1)/2)*13,d:.22})}});
  after(ch+rounds*gap+.35,()=>{A.pose='idle';A.ball=0;done&&done()});

function showResult(won){
  const cfg=B.cfg,md=cfg.mode;let cr=0,xp=0,stars=0,newFighter=null,note=[];
  if(won){
    S.mis.win++;
    if(md==='story'){const first=cfg.idx>=S.cleared;cr=first?cfg.cr*5:15;xp=150+cfg.idx*35;if(first){S.cleared=cfg.idx+1;const u=STAGES[cfg.idx].unlock;if(u){newFighter=u;S.owned[u]=Math.min(14,(S.owned[u]||0)+1)}}stars=1+(B.time>=B.tmax-100?1:0)+(B.kos===0?1:0);S.stars[cfg.idx]=Math.max(S.stars[cfg.idx]||0,stars)}
    else if(md==='survival'){cr=40+cfg.wave*10;xp=100+cfg.wave*40;S.hunt=Math.max(S.hunt,cfg.wave);HUNT={wave:cfg.wave+1,carry:B.team.map(m=>({hp:m.dead?0:Math.min(m.max,m.hp+m.max*.25),dead:m.dead}))}}
    else if(md==='pvp'){cr=40;xp=150}
    else if(md==='raid'){cr=400;xp=800;note.push('RAID BOSS DEFEATED!')}
    else if(md==='trial'){xp=450;const k=cfg.slot+':'+cfg.target;if(!S.trials[k]){S.trials[k]=1;if(chStars(cfg.target)<14){S.owned[cfg.target]=chStars(cfg.target)+1;note.push(CH[cfg.target].n+' +1 STAR!')}else{cr=100;note.push('MAX STARS: +100 GEMS')}}else note.push('STAR ALREADY CLAIMED THIS ROTATION')}
  }else{
    xp=md==='story'?30+cfg.idx*6:40;
    if(md==='survival'){cr=Math.floor((cfg.wave-1)*20);HUNT=null;xp=30+cfg.wave*10}
    if(md==='raid'){const f=B.foes[0],dealt=Math.max(0,f.max-f.hp)/f.max;cr=Math.min(150,Math.floor(dealt*200));xp=Math.round(100+dealt*300);note.push('BOSS HP DOWN '+Math.round(dealt*100)+'%')}
  }
  S.cr+=cr;
  const lines=S.team.map(id=>{const a=chLv(id),ups=giveXP(id,xp),b=chLv(id);return CH[id].n+' LV '+a+(b>a?' > '+b:'')+(b>=LVMAX?' MAX':'')});
  save();refreshHdr();
  let h='<h3>'+(won?'VICTORY!':'DEFEAT')+'</h3>';
  if(won&&md==='story')h+='<div class="stars" style="font-size:26px;margin-bottom:6px">'+[1,2,3].map(k=>k<=stars?'<em>*</em>':'*').join('')+'</div><p style="font-size:7px;color:#9fb0ff">WIN / UNDER 100s / NO KO</p>';
  if(md==='survival')h+='<p>WAVE '+cfg.wave+(won?' CLEARED':' REACHED')+'</p>';
  note.forEach(n=>h+='<p style="color:var(--yellow)">'+n+'</p>');
  h+='<p>BEST COMBO '+B.maxCombo+'</p>';
  if(cr)h+='<p><span class="gem"></span>+'+cr+' GEMS</p>';
  h+='<p>+'+xp+' XP EACH</p><p style="font-size:7px;line-height:2;color:#bfe0ff">'+lines.join('<br>')+'</p>';
  if(won&&md==='story'&&cfg.idx+1<STAGES.length&&cfg.idx+1===S.cleared)h+='<p style="color:var(--yellow)">STAGE '+(cfg.idx+2)+' UNLOCKED</p>';
  const box=modal(h);
  if(newFighter){const d=document.createElement('div');d.className='pull one';const pc=document.createElement('div');pc.className='pc px';pc.style.setProperty('--rc',RC[CH[newFighter].r]);pc.style.setProperty('--bd',RC[CH[newFighter].r]);pc.appendChild(portrait(newFighter));pc.insertAdjacentHTML('beforeend','<i>NEW!</i>');d.appendChild(pc);box.insertBefore(d,box.firstChild.nextSibling);const t=document.createElement('p');t.style.color='var(--yellow)';t.textContent='FIGHTER JOINED: '+CH[newFighter].n;d.after(t)}
  const home=['BACK',()=>{closeModal();exitBattle(backTo(md))},'#2a3aa8'];
  if(md==='story'){const l=[];if(won&&cfg.idx+1<STAGES.length)l.push(['NEXT',()=>startBattle(storyCfg(cfg.idx+1)),'#f0701c']);l.push(['RETRY',()=>startBattle(storyCfg(cfg.idx)),'#2a6af0'],home);addBtns(box,l)}
  else if(md==='survival'){if(won)addBtns(box,[['NEXT WAVE',()=>startBattle(survivalCfg(HUNT.wave,HUNT.carry)),'#1fa03a'],home]);else addBtns(box,[['RESTART',()=>{HUNT={wave:1,carry:null};startBattle(survivalCfg(1,null))},'#1fa03a'],home])}
  else if(md==='raid')addBtns(box,[['RETRY',()=>startBattle(raidCfg()),'#2a6af0'],home]);
  else if(md==='trial')addBtns(box,[['RETRY',()=>startBattle(trialCfg(cfg.target)),'#2a6af0'],home]);
  else addBtns(box,[['AGAIN',()=>startBattle(pvpCfg()),'#2a6af0'],home]);
}

/* ---------- banners (rotate every 30 min, 6 mixed-character pools, pity) ---------- */
const BNAMES=[['CRIMSON DAWN','#ff5a4a'],['AZURE TIDE','#4aa8ff'],['EMERALD STORM','#40d95a'],['GOLDEN ARC','#ffd23a'],['VIOLET ECLIPSE','#a05cf2'],['PINK COMET','#ff6ad8']];
const PITY_MAX=40;
let curBanner=0,lastSlot=slotNow();
function bpools(slot){
  const rn=rng32(slot*2654435761+12345),by={UR:[],SR:[],R:[]};PLAY.forEach(id=>by[CH[id].r].push(id));
  const pools=BNAMES.map(()=>({UR:[],SR:[],R:[]}));
  ['UR','SR','R'].forEach(r=>{shuf(by[r].slice(),rn).forEach((id,i)=>pools[i%6][r].push(id))});
  return pools;
}
const fmtT=ms=>{const s=Math.max(0,Math.ceil(ms/1000));return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0')};
const nextSlotIn=()=>(slotNow()+1)*SLOT_MS-Date.now();
function renderSummon(){
  const pl=bpools(slotNow())[curBanner],bn=BNAMES[curBanner],feat=pl.UR[0];
  const tabs=$('#btabs');tabs.innerHTML='';

  if(k==='1'||k==='2'||k==='3')useCard(+k-1);else if(k==='g')tapGuard();else if(k==='v')tapVanish();else if(k==='u')useUlt();else if(k==='a')toggleAuto();
  else if(k==='escape'||k==='p')pauseGame();
  else if(k==='q'||k==='w'){const o=B.team.map((t,i)=>i).filter(i=>i!==B.a);swapTo(k==='q'?o[0]:o[1])}
});
document.addEventListener('visibilitychange',()=>{if(document.hidden&&B&&cur==='battle')pauseGame()});
addEventListener('resize',()=>{fitHome();if(cur==='battle'&&B){fit();if(B.phase==='idle'){P.x=P.hx;P.y=P.hy;E.x=E.hx;E.y=E.hy}}});
let last=0,flip=false;
function loop(ts){
  const dt=Math.min(.05,(ts-last)/1000||0);last=ts;
  try{if(cur==='battle'&&B){update(dt);flip=!flip;if(bg&&(GQ()>0||flip))render()}else if(cur==='home')homeFrame(ts/1000)}catch(e){console.error(e)}
  requestAnimationFrame(loop);
}
buildHud();drawIcons();refreshHdr();fitHome();renderHome();
requestAnimationFrame(loop);
})();
</script>
